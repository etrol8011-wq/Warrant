<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>權證雷達 - 登入</title>
<style>
  :root{color-scheme:dark;}
  body{margin:0;background:#0d1117;color:#c9d1d9;font-family:"微軟正黑體",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;box-sizing:border-box;}
  form{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:28px 24px;width:100%;max-width:320px;}
  h1{font-size:18px;color:#39d0d8;margin:0 0 18px;text-align:center;}
  input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;background:#21262d;border:1px solid #30363d;
       border-radius:6px;color:#c9d1d9;font-size:15px;margin-bottom:12px;}
  button{width:100%;padding:10px;background:#58a6ff;color:#0d1117;border:none;border-radius:6px;
       font-weight:bold;font-size:15px;cursor:pointer;}
  .err{color:#f85149;font-size:13px;text-align:center;margin-bottom:10px;}
</style>
</head>
<body>
<form method="post">
  <h1>◈ 權證雷達</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="密碼" autofocus required>
  <button type="submit">登入</button>
</form>
</body>
</html>
